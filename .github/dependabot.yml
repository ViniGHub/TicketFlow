# Atualização automática de dependências. Atualizações menores e de patch chegam agrupadas
# num PR semanal por ecossistema; majors vêm em PRs separados, para revisão individual.
version: 2
updates:
  - package-ecosystem: npm # cobre o pnpm (lê o pnpm-lock.yaml)
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # O typescript-eslint ainda não suporta o TypeScript 7 (ADR 0001). Remover quando suportar.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Os tipos acompanham o runtime (Node 24 LTS); sobem junto com a troca de versão do Node.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/worker
      - /apps/web
    schedule:
      interval: weekly
    ignore:
      # A imagem base fica no Node 24 LTS (engines e .nvmrc); trocar de major é decisão manual.
      - dependency-name: node
        update-types: [version-update:semver-major]
