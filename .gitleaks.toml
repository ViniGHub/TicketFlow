# Configuração do gitleaks: regras padrão + exceção para placeholders documentados.
# Só valores exatos de exemplo entram aqui; nunca libere padrões genéricos.

[extend]
useDefault = true

[allowlist]
description = "Placeholders do .env.example e da documentação, e segredos fixos dos testes"
regexes = [
  '''^troque-isto-por-um-segredo-com-32-caracteres-ou-mais$''',
  # JWT_SECRET dos testes de integração da API (apps/api/test/app.ts).
  '''^segredo-de-teste-com-mais-de-32-caracteres$''',
]
